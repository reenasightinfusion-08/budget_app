<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Document Sheet -->
  <g filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.08))">
    <!-- Paper body with folded dog-ear corner at top-right -->
    <path d="M22 18C22 14.6863 24.6863 12 28 12H58L76 30V80C76 83.3137 73.3137 86 70 86H28C24.6863 86 22 83.3137 22 80V18Z" fill="#FFFFFF" stroke="#0E9AA7" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Dog-ear fold triangle -->
    <path d="M58 12V26C58 28.2091 59.7909 30 62 30H76" fill="#E2F7F9" stroke="#0E9AA7" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Document header lines -->
    <path d="M30 24H48" stroke="#0E9AA7" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M30 32H40" stroke="#76C7D0" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Document content placeholder lines -->
    <path d="M30 42H64" stroke="#76C7D0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 50H64" stroke="#76C7D0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 58H52" stroke="#76C7D0" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Red "PDF" Badge at bottom-left -->
  <g transform="translate(14, 60)">
    <rect width="36" height="18" rx="4" fill="#E33E38"/>
    <text x="18" y="13.2" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PDF</text>
  </g>

  <!-- Teal Upload Badge at bottom-right -->
  <g transform="translate(60, 56)">
    <circle cx="16" cy="16" r="15" fill="#129AA9"/>
    <!-- Upward arrow -->
    <path d="M16 23V9M10.5 14.5L16 9L21.5 14.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
